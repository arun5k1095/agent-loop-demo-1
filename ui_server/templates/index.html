<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent lesson</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Ask the agent</h1>
    <p class="hint">The weather tool needs <code>tool_server/app.py</code> running in another terminal.</p>

    <form id="ask-form">
      <label for="question">Question</label>
      <input id="question" type="text" maxlength="500" required autocomplete="off"
             placeholder="What's the weather in Paris?">
      <button id="ask-button" type="submit">Ask</button>
    </form>

    <section aria-live="polite">
      <h2>What the loop did</h2>
      <ul id="steps"></ul>
      <h2>Final answer</h2>
      <p id="answer"></p>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
